# Source: incidentdesk/templates/context.yaml
apiVersion: apps/v1
kind: Deployment
metadata: {name: context}
spec:
  replicas: 1
  selector: {matchLabels: {app: context}}
  template:
    metadata:
      labels: {app: context, incidentdesk: "true"}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: context
          image: incidentdesk-worker:0.7.0
          command: ["uvicorn", "incident_worker.context_api:app", "--host", "0.0.0.0", "--port", "8091"]
          envFrom: [{configMapRef: {name: incident-config}}]
          env:
            - name: CHECKPOINT_DATABASE_URL
              valueFrom: {secretKeyRef: {name: incident-secrets, key: CHECKPOINT_DATABASE_URL}}
            - name: SOURCE_DATABASE_URL
              valueFrom: {secretKeyRef: {name: incident-secrets, key: SOURCE_DATABASE_URL}}
            - name: INTERNAL_KEY
              valueFrom: {secretKeyRef: {name: incident-secrets, key: INTERNAL_KEY}}
          ports: [{containerPort: 8091}]
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "1", memory: "768Mi"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          readinessProbe: {httpGet: {path: /healthz, port: 8091}, periodSeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: 8091}, periodSeconds: 10}

