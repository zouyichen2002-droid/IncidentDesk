kind: Deployment
metadata:
  name: worker
spec:
  replicas: 3
  selector:
    matchLabels: {app: worker}
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: worker, incidentdesk: "true"}
    spec:
      serviceAccountName: worker
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: incidentdesk-worker:0.7.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: incident-config}
          env:
            - name: CHECKPOINT_DATABASE_URL
              valueFrom: {secretKeyRef: {name: incident-secrets, key: CHECKPOINT_DATABASE_URL}}
            - name: SOURCE_DATABASE_URL
              valueFrom: {secretKeyRef: {name: incident-secrets, key: SOURCE_DATABASE_URL}}
            - name: INTERNAL_KEY
              valueFrom: {secretKeyRef: {name: incident-secrets, key: INTERNAL_KEY}}
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "1", memory: "768Mi"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          startupProbe:
            exec: {command: ["python", "-c", "import pathlib; assert pathlib.Path('/tmp/worker-alive').exists()"]}
            failureThreshold: 60
            periodSeconds: 2
          livenessProbe:
            exec: {command: ["python", "-c", "import pathlib,time; assert time.time()-pathlib.Path('/tmp/worker-alive').stat().st_mtime<30"]}
            periodSeconds: 10
          readinessProbe:
            exec: {command: ["python", "-c", "import pathlib; assert pathlib.Path('/tmp/worker-alive').exists()"]}
            periodSeconds: 5

