# Source: incidentdesk/templates/workloads.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: api, incidentdesk: "true"}
    spec:
      serviceAccountName: api
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: incidentdesk-api:0.7.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: incident-config}
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: incident-secrets, key: DATABASE_URL}}
            - name: INTERNAL_KEY
              valueFrom: {secretKeyRef: {name: incident-secrets, key: INTERNAL_KEY}}
          resources:
            requests: {cpu: "50m", memory: "128Mi"}
            limits: {cpu: "1", memory: "768Mi"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          ports: [{containerPort: 8080}]
          startupProbe:
            httpGet: {path: /healthz, port: 8080}
            failureThreshold: 60
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
            periodSeconds: 3

