# Compose containers may receive a new IP after recreation. Re-resolve service
# names rather than retaining the addresses from the web container's startup.
resolver 127.0.0.11 valid=5s ipv6=off;
upstream incident_api {
  zone incident_api 64k;
  server api:8080 resolve;
}
upstream incident_identity {
  zone incident_identity 64k;
  server demo:8090 resolve;
}
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  location / { try_files $uri /index.html; }
  location /api/ {
    proxy_pass http://incident_api;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 100s;
  }
  location /identity/ { proxy_pass http://incident_identity/; }
}
