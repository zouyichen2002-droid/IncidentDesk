name: IncidentDesk verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.1', cache-dependency-path: backend/go.sum}
      - uses: actions/setup-node@v4
        with: {node-version: '24.18.0', cache: npm, cache-dependency-path: web/package-lock.json}
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.10.12'}
      - uses: azure/setup-helm@v4
        with: {version: 'v4.3.0'}
      - run: uv sync --project worker --frozen --python 3.12
      - run: cd worker && uv run pytest -q
      - run: uv sync --project query --frozen --python 3.14
      - run: cd query && uv run python -m unittest discover -s tests -v
      - run: uv run --project worker python scripts/evaluate.py
      - run: cd backend && go vet ./... && go test -race ./...
      - run: cd web && npm ci && npm run build && npm audit --audit-level=high
      - run: helm lint deploy/helm/incidentdesk && helm template incidentdesk deploy/helm/incidentdesk > /tmp/rendered.yaml
      # The fixture suite requires no paid model key or NL2SQL indexes.
      - run: docker compose up -d --wait postgres
      - run: docker compose up -d --build --no-deps demo api objects worker context
      - run: |
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/readyz && break || sleep 2; done
          curl -fsS http://localhost:8080/readyz
          uv run --project worker python scripts/smoke.py
          scripts/test-go.sh
      - run: docker build -t incidentdesk-sandbox:0.1.0 sandbox && python scripts/test_sandbox.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: acceptance-evidence, path: docs/evidence}
