[project]
name = "incident-worker"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
 "httpx==0.28.1",
 "pydantic==2.12.5",
 "psycopg[binary,pool]==3.3.3",
 "langgraph==1.1.3",
 "langgraph-checkpoint-postgres==3.0.4",
 "deepagents==0.4.11",
 "mcp==1.26.0",
 "fastapi==0.135.1",
 "uvicorn==0.42.0",
 "PyJWT[crypto]==2.12.1",
 "boto3==1.42.68",
 "opentelemetry-sdk==1.40.0",
 "langchain-openai==1.1.11",
 "langgraph-prebuilt==1.0.8",
]
[dependency-groups]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "ruff==0.15.6"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
