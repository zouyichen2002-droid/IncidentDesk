apiVersion: apps/v1
kind: Deployment
metadata: {name: web}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web, incidentdesk: "true"}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: incidentdesk-web:{{ .Values.webImageTag | default .Values.imageTag }}
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 80}]
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 200m, memory: 96Mi}}
          readinessProbe: {httpGet: {path: /, port: 80}, periodSeconds: 3}
          livenessProbe: {httpGet: {path: /, port: 80}, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: web}
spec:
  selector: {app: web}
  ports: [{port: 80}]
