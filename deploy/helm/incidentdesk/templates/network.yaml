apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: app-internal}
spec:
  podSelector: {matchLabels: {incidentdesk: "true"}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {incidentdesk: "true"}}}]
  egress:
    - to: [{podSelector: {matchLabels: {incidentdesk: "true"}}}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: demo-cluster-observer}
spec:
  podSelector: {matchLabels: {app: demo}}
  policyTypes: [Egress]
  egress:
    - ports: [{port: 443, protocol: TCP}, {port: 6443, protocol: TCP}]
---
apiVersion: v1
kind: Namespace
metadata: {name: incident-demo}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: observer, namespace: incident-demo}
rules:
  - apiGroups: ['']
    resources: [pods, events]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: observer, namespace: incident-demo}
subjects:
  - kind: ServiceAccount
    name: demo
    namespace: {{ .Release.Namespace }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: observer}
---
apiVersion: v1
kind: Namespace
metadata: {name: incident-sandbox}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: sandbox-deny-all, namespace: incident-sandbox}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: sandbox-runner, namespace: incident-sandbox}
rules:
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [create, delete]
  - apiGroups: ['']
    resources: [pods, pods/log]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: sandbox-runner, namespace: incident-sandbox}
subjects:
  - kind: ServiceAccount
    name: api
    namespace: {{ .Release.Namespace }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: sandbox-runner}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: api-sandbox-control}
spec:
  podSelector: {matchLabels: {app: api}}
  policyTypes: [Egress]
  egress:
    - ports: [{port: 443, protocol: TCP}, {port: 6443, protocol: TCP}]

{{- if .Values.model.existingSecret }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: model-client-egress}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [worker, context]
  policyTypes: [Egress]
  egress:
    - ports: [{port: 443, protocol: TCP}]
{{- end }}
